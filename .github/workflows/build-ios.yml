name: Build iOS port

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install premake5
        # Fetch the official release binary directly (rather than trust
        # whatever Homebrew resolves) for a known, reproducible version.
        run: |
          curl -L -o premake5.tar.gz https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-macosx.tar.gz
          tar -xzf premake5.tar.gz
          chmod +x premake5
          ./premake5 --version
          echo "PREMAKE5=$(pwd)/premake5" >> "$GITHUB_ENV"

      - name: Rebuild SDL2 for the iOS SDK
        # third_party/SDL2/lib/libSDL2.a was built by the upstream tvOS port
        # against appletvos -- the linker refuses to link it into an iOS
        # target ("building for iOS, but linking in object file built for
        # tvOS"). Rebuild the same SDL version from source against iphoneos
        # and overwrite it in place; everything else about third_party/SDL2
        # (headers, third_party/SDL2 dir layout) stays as-is.
        run: |
          SDL_VERSION=release-2.32.10
          git clone --depth 1 --branch "$SDL_VERSION" https://github.com/libsdl-org/SDL.git /tmp/SDL2-src
          cmake -S /tmp/SDL2-src -B /tmp/SDL2-build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON
          cmake --build /tmp/SDL2-build --config Release --target SDL2-static -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          find /tmp/SDL2-build -name "libSDL2.a"
          cp "$(find /tmp/SDL2-build -name 'libSDL2.a' | head -1)" third_party/SDL2/lib/libSDL2.a
          file third_party/SDL2/lib/libSDL2.a

      - name: Rebuild libpng for the iOS SDK
        # Same issue as SDL2 above: the vendored libpng16.a was built for
        # appletvos. Rebuild it against iphoneos and overwrite it in place.
        run: |
          PNG_VERSION=v1.6.53
          git clone --depth 1 --branch "$PNG_VERSION" https://github.com/glennrp/libpng.git /tmp/libpng-src
          cmake -S /tmp/libpng-src -B /tmp/libpng-build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DPNG_SHARED=OFF \
            -DPNG_STATIC=ON \
            -DPNG_TESTS=OFF \
            -DPNG_TOOLS=OFF
          cmake --build /tmp/libpng-build --config Release --target png_static -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          find /tmp/libpng-build -name "libpng16.a"
          cp "$(find /tmp/libpng-build -name 'libpng16.a' | head -1)" third_party/libpng/lib/libpng16.a
          file third_party/libpng/lib/libpng16.a

      - name: Rebuild OpenAL Soft for the iOS SDK
        # Same issue as SDL2/libpng above: the vendored libopenal.a was built
        # for appletvos.
        run: |
          AL_VERSION=1.25.0
          git clone --depth 1 --branch "$AL_VERSION" https://github.com/kcat/openal-soft.git /tmp/openal-src
          cmake -S /tmp/openal-src -B /tmp/openal-build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DLIBTYPE=STATIC \
            -DALSOFT_EXAMPLES=OFF \
            -DALSOFT_UTILS=OFF \
            -DALSOFT_TESTS=OFF
          cmake --build /tmp/openal-build --config Release --target OpenAL -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          find /tmp/openal-build -name "libopenal.a"
          cp "$(find /tmp/openal-build -name 'libopenal.a' | head -1)" third_party/OpenALSoft/lib/libopenal.a
          file third_party/OpenALSoft/lib/libopenal.a

      - name: Audit remaining third_party binaries for wrong-platform Mach-O tags
        # Cheap (~seconds) upfront check so a wrong-SDK-platform library shows
        # up here instead of costing a full xcodebuild round-trip. platform 2
        # = iOS, platform 3 = tvOS in Apple's LC_BUILD_VERSION load command.
        run: |
          echo "--- static libs ---"
          find third_party -name "*.a" | while read -r f; do
            echo "== $f"
            lipo -info "$f" 2>&1
            otool -l "$f" 2>/dev/null | grep -A3 "LC_BUILD_VERSION\|LC_VERSION_MIN" | grep -E "platform|cmd " || true
          done
          echo "--- frameworks ---"
          find third_party -path "*.framework" -type d | while read -r fw; do
            bin="$fw/$(basename "$fw" .framework)"
            [ -f "$bin" ] || continue
            echo "== $bin"
            lipo -info "$bin" 2>&1
            otool -l "$bin" 2>/dev/null | grep -A3 "LC_BUILD_VERSION\|LC_VERSION_MIN" | grep -E "platform|cmd " || true
          done

      - name: Fetch prebuilt iOS FFmpeg (from build-ffmpeg-ios.yml release, if published yet)
        # The vendored third_party/ffmpeg/*.framework binaries are tvOS-tagged
        # (same issue as SDL2/libpng/OpenAL above), and FFmpeg is too slow to
        # cross-compile on every push -- see build-ffmpeg-ios.yml, which
        # builds it once and publishes a release asset. Until that's run at
        # least once, this step finds nothing and the FFmpeg link error below
        # is expected -- everything else in this job still validates fine.
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          gh release download ffmpeg-ios-6.1.2-arm64 --repo "$GITHUB_REPOSITORY" -p "*.tar.gz" -O ffmpeg-ios.tar.gz \
            && tar -xzf ffmpeg-ios.tar.gz \
            && for lib in avcodec avformat avutil swresample swscale; do
                 cp "ffmpeg-frameworks/lib${lib}.framework/lib${lib}" "third_party/ffmpeg/lib${lib}.framework/lib${lib}"
               done \
            && echo "Replaced vendored FFmpeg with the iOS-built release asset." \
            || echo "No ffmpeg-ios-6.1.2-arm64 release found yet -- run build-ffmpeg-ios.yml once first. Continuing with the (tvOS-tagged) vendored copy."

      - name: Create placeholder game assets
        # No game assets are stored in this repo (personal/educational port,
        # user extracts their own from a legitimately owned copy -- see
        # PORTING-NOTES.md). premake5.lua's postbuildcommands `cp -R` real
        # asset folders into the app bundle; without *something* there the
        # copy step fails before we even find out whether the C++/Obj-C++
        # compiled. These placeholders exist only so CI can validate
        # compilation and linking -- the resulting .app will not run/play.
        run: |
          mkdir -p assets/art assets/scripts assets/movies assets/sound
          touch assets/art/.keep assets/scripts/.keep assets/movies/.keep assets/sound/.keep
          for f in ambience carsound dialog music00 music01 music02 music03 nis scripts; do
            touch "assets/${f}.rcf"
          done

      - name: Generate Xcode project
        run: |
          "$PREMAKE5" xcode4

      - name: List generated project and targets (debug aid)
        run: |
          find build -maxdepth 2
          xcodebuild -project build/SRR2.xcodeproj -list || true

      # NOTE: third_party/{SDL2,libpng,OpenALSoft,ffmpeg} are prebuilt
      # single-platform binaries (no .xcframework slices found), almost
      # certainly built for the iphoneos/appletvos *device* SDK only. This
      # simulator build will very likely compile the C++ fine and then fail
      # at the link step (wrong SDK/platform for these .a/.framework files).
      # Kept anyway (continue-on-error) because a compile-only failure here
      # still tells us the source is syntactically sound; the iphoneos device
      # build below is the one that actually matters.
      - name: Build for iOS Simulator (no signing required, may fail to link -- see note above)
        id: sim_build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project build/SRR2.xcodeproj \
            -target SRR2 \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            | tee simulator-build.log

      - name: Build for iOS device SDK (unsigned -- validates against real SDK, not installable as-is)
        id: device_build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project build/SRR2.xcodeproj \
            -target SRR2 \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee device-build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            simulator-build.log
            device-build.log
          retention-days: 14

      - name: Upload built .app bundles (unsigned -- not installable without your own signing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-bundles
          path: |
            build/**/*.app
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail job if both builds failed
        if: steps.sim_build.outcome != 'success' && steps.device_build.outcome != 'success'
        run: |
          echo "Both builds failed -- see build-logs artifact for the actual compiler/linker errors."
          exit 1
